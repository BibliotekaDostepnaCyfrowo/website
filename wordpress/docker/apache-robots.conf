# Staging must not be indexed: set NOINDEX=1 in the container. Production leaves
# it unset. Done here because the cluster's ingress-nginx doesn't allow per-site
# response headers. BZ_NOINDEX is the old name, honoured until staging uses NOINDEX.
Header always set X-Robots-Tag "noindex, nofollow" "expr=-n env('NOINDEX') || -n env('BZ_NOINDEX')"
